        :root, body.theme-terracotta {
            --bg-primary: #C86432;
            --bg-secondary: #C86432;
            --text-primary: #fff;
            --text-secondary: #fff;
            --border-color: #fff;
            --accent-color: #FF1493;
            --accent-light: #FF69B4;
            --accent-bright: #FFB6D9;
        }

        body.theme-lemon {
            --bg-primary: #FFF8DC;
            --bg-secondary: #FFF8DC;
            --text-primary: #222;
            --text-secondary: #666;
            --border-color: #333;
            --accent-color: #FFD700;
            --accent-light: #FFE4B5;
            --accent-bright: #FFFACD;
        }

        body.theme-dark {
            --bg-primary: #000;
            --bg-secondary: #000;
            --text-primary: #fff;
            --text-secondary: #aaa;
            --border-color: #fff;
            --accent-color: #FFD700;
            --accent-light: #111;
            --accent-bright: #222;
        }

        body {
            font-family: 'Courier New', 'Courier', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
        }

        .container {
            background: var(--bg-primary);
            border: 3px solid var(--border-color);
            max-width: 1400px;
            margin: 20px auto;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 40px 40px 30px 40px;
            border-bottom: 3px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-content h1 {
            font-size: 4em;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1;
            color: var(--text-primary);
        }

        .header-content p {
            font-size: 1.2em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .theme-selector {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .theme-label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 900;
            color: var(--text-secondary);
            margin-right: 10px;
        }

        .theme-btn {
            padding: 10px 16px;
            border: 2px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
            transition: all 0s;
        }

        .theme-btn.active {
            background: var(--accent-color);
            color: var(--text-primary);
            border-color: var(--accent-color);
        }

        .theme-btn:hover {
            background: var(--accent-light);
            border-color: var(--accent-color);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            min-height: 600px;
        }

        .upload-section {
            border-right: 3px solid var(--border-color);
            padding: 40px;
            display: flex;
            flex-direction: column;
        }
