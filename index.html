        :root, body.theme-terracotta {
            --bg-primary: #C86432;
            --bg-secondary: #C86432;
            --text-primary: #fff;
            --text-secondary: #fff;
            --border-color: #fff;
            --accent-color: #FF1493;
            --accent-light: #FF69B4;
            --accent-bright: #FFB6D9;
        }

        body.theme-lemon {
            --bg-primary: #FFF8DC;
            --bg-secondary: #FFF8DC;
            --text-primary: #222;
            --text-secondary: #666;
            --border-color: #333;
            --accent-color: #FFD700;
            --accent-light: #FFE4B5;
            --accent-bright: #FFFACD;
        }

        body.theme-dark {
            --bg-primary: #000;
            --bg-secondary: #000;
            --text-primary: #fff;
            --text-secondary: #aaa;
            --border-color: #fff;
            --accent-color: #FFD700;
            --accent-light: #111;
            --accent-bright: #222;
        }

        body {
            font-family: 'Courier New', 'Courier', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
        }

        .container {
            background: var(--bg-primary);
            border: 3px solid var(--border-color);
            max-width: 1400px;
            margin: 20px auto;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 40px 40px 30px 40px;
            border-bottom: 3px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-content h1 {
            font-size: 4em;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1;
            color: var(--text-primary);
        }

        .header-content p {
            font-size: 1.2em;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .theme-selector {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .theme-label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 900;
            color: var(--text-secondary);
            margin-right: 10px;
        }

        .theme-btn {
            padding: 10px 16px;
            border: 2px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
            transition: all 0s;
        }

        .theme-btn.active {
            background: var(--accent-color);
            color: var(--text-primary);
            border-color: var(--accent-color);
        }

        .theme-btn:hover {
            background: var(--accent-light);
            border-color: var(--accent-color);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            min-height: 600px;
        }

        .upload-section {
            border-right: 3px solid var(--border-color);
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        .upload-section h2 {
            font-size: 1.8em;
            color: var(--text-primary);
            margin-bottom: 30px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .upload-area {
            border: 3px solid var(--border-color);
            padding: 60px 30px;
            text-align: center;
            background: var(--bg-primary);
            cursor: pointer;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0s;
        }

        .upload-area:hover {
            background: var(--accent-light);
        }

        .upload-area.active {
            border: 3px solid var(--accent-color);
            background: var(--accent-bright);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .upload-text {
            color: var(--text-primary);
            font-size: 1.1em;
            margin-bottom: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .upload-subtext {
            color: var(--text-secondary);
            font-size: 0.95em;
            letter-spacing: 1px;
        }

        input[type="file"] {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-direction: column;
        }

        button {
            padding: 16px 24px;
            border: 2px solid var(--border-color);
            border-radius: 0;
            font-size: 1em;
            font-weight: 900;
            cursor: pointer;
            background: var(--bg-primary);
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0s;
            font-family: 'Courier New', monospace;
        }

        button:hover {
            background: var(--accent-color);
            color: var(--text-primary);
            border-color: var(--accent-color);
        }

        .preview-section {
            display: none;
            margin-top: 30px;
        }

        .preview-section h2 {
            font-size: 1.3em;
            margin-bottom: 15px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--text-primary);
        }

        #canvas {
            max-width: 100%;
            display: block;
            border: 2px solid var(--border-color);
            background: #fff;
        }

        .empty-results-placeholder {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            background: var(--bg-primary);
        }

        .placeholder-box {
            border: 3px dashed var(--border-color);
            padding: 50px 30px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .placeholder-graphic {
            font-size: 3.5em;
            margin-bottom: 20px;
            opacity: 0.85;
        }

        .placeholder-title {
            font-size: 1.4em;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .placeholder-text {
            font-size: 0.95em;
            line-height: 1.6;
            letter-spacing: 1px;
            color: var(--text-secondary);
            max-width: 340px;
            text-transform: uppercase;
        }

        .results-section {
            display: none;
            padding: 40px;
            background: var(--bg-primary);
        }

        .results-section h2 {
            font-size: 1.8em;
            color: var(--text-primary);
            margin-bottom: 30px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .color-display {
            background: var(--bg-primary);
            border: 3px solid var(--border-color);
            padding: 30px;
            margin-bottom: 30px;
        }

        .color-swatch {
            width: 100%;
            height: 180px;
            margin-bottom: 30px;
            border: 3px solid var(--border-color);
            background: #fff;
        }

        .color-values {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .value-item {
            background: var(--bg-primary);
            padding: 20px;
            border: 2px solid var(--border-color);
        }

        .value-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 900;
        }

        .value-text {
            font-size: 1.4em;
            color: var(--text-primary);
            font-weight: 900;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            letter-spacing: 1px;
        }

        .palette-section {
            background: var(--bg-primary);
            border: 3px solid var(--border-color);
            padding: 30px;
            margin-bottom: 30px;
        }

        .palette-section h3 {
            font-size: 1.3em;
            color: var(--text-primary);
            margin-bottom: 25px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .palette-item {
            text-align: center;
        }

        .palette-color {
            width: 100%;
            aspect-ratio: 1;
            margin-bottom: 10px;
            border: 2px solid var(--border-color);
            cursor: pointer;
            background: #fff;
        }

        .palette-hex {
            font-size: 0.8em;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            margin-bottom: 5px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .palette-percent {
            font-size: 0.95em;
            color: var(--text-primary);
            font-weight: 900;
            text-transform: uppercase;
        }

        .stats-section {
            background: var(--bg-primary);
            border: 3px solid var(--border-color);
            padding: 30px;
        }

        .stats-section h3 {
            font-size: 1.3em;
            color: var(--text-primary);
            margin-bottom: 25px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-item {
            background: var(--bg-primary);
            padding: 20px;
            border: 2px solid var(--border-color);
        }

        .stat-label {
            font-size: 0.8em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 900;
        }

        .stat-value {
            font-size: 2em;
            color: var(--text-primary);
            font-weight: 900;
            letter-spacing: 1px;
        }
