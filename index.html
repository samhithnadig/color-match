<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ColorMatch // Automated Paint Analyzer Bot</title>
    <style>
        /* Neo-Brutalist Theme System Definitions */
        :root {
            --bg: #eae6df;
            --panel-bg: #ffffff;
            --text: #1a1a1a;
            --border: #1a1a1a;
            --shadow: #1a1a1a;
            --accent: #ff6b6b;
            --accent-hover: #ff5252;
            --brutal-thickness: 4px;
        }

        .theme-terracotta {
            --bg: #f4e8e1;
            --panel-bg: #ffffff;
            --text: #2b1a13;
            --border: #2b1a13;
            --shadow: #2b1a13;
            --accent: #d35400;
            --accent-hover: #ba4a00;
        }

        .theme-lemon {
            --bg: #fef9e7;
            --panel-bg: #ffffff;
            --text: #2c3e50;
            --border: #1a1a1a;
            --shadow: #1a1a1a;
            --accent: #f1c40f;
            --accent-hover: #d4ac0d;
        }

        .theme-dark {
            --bg: #121212;
            --panel-bg: #1e1e1e;
            --text: #f5f5f5;
            --border: #f5f5f5;
            --shadow: #f5f5f5;
            --accent: #4a90a4;
            --accent-hover: #3a788a;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.2s, color 0.2s;
            overflow-x: hidden;
        }

        /* Brutalist Container Elements */
        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            position: relative;
        }

        .brutal-box {
            background-color: var(--panel-bg);
            border: var(--brutal-thickness) solid var(--border);
            box-shadow: var(--brutal-thickness) var(--brutal-thickness) 0px var(--shadow);
            padding: 20px;
            position: relative;
        }

        /* Header Layout Matrix */
        .header-wrapper {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--accent);
            border: var(--brutal-thickness) solid var(--border);
            box-shadow: var(--brutal-thickness) var(--brutal-thickness) 0px var(--shadow);
            padding: 8px 16px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
        }

        /* Vector Line Drawing Settings Icon */
        .settings-trigger {
            background: var(--panel-bg);
            border: 2px solid var(--border);
            box-shadow: 2px 2px 0px var(--shadow);
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            box-sizing: border-box;
        }

        .settings-trigger svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--text);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .settings-trigger:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--shadow);
        }

        /* LEFT-SIDEBAR SYSTEM NAVIGATION DESIGN */
        .settings-sidebar {
            position: fixed;
            top: 0;
            left: -320px; 
            width: 280px;
            height: 100%;
            background-color: var(--panel-bg);
            border-right: var(--brutal-thickness) solid var(--border);
            box-shadow: 5px 0px 0px var(--shadow);
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }

        .settings-sidebar.open {
            left: 0; 
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
            display: none;
        }

        .sidebar-overlay.open {
            display: block;
        }

        .sidebar-close-btn {
            background: var(--accent);
            border: 2px solid var(--border);
            font-weight: bold;
            padding: 4px 8px;
            cursor: pointer;
            float: right;
            box-shadow: 2px 2px 0px var(--shadow);
        }

        /* Controls & Theme Switchers */
        .theme-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .theme-option {
            width: 100%;
            padding: 10px;
            border: 3px solid var(--border);
            background: var(--panel-bg);
            color: var(--text);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            box-shadow: 3px 3px 0px var(--shadow);
            text-align: left;
        }

        .theme-option.active {
            background: var(--accent);
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px var(--shadow);
        }

        .action-btn {
            background-color: var(--accent);
            color: var(--text);
            font-weight: bold;
            font-family: inherit;
            border: 3px solid var(--border);
            padding: 10px 16px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--shadow);
            text-transform: uppercase;
        }

        .action-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--shadow);
        }

        /* Image Display Layout Box */
        .image-wrapper {
            display: none;
            margin-top: 15px;
            border: 3px solid var(--border);
            background: #fff;
            padding: 5px;
        }

        #viewContainer {
            width: 100%;
            height: auto;
            max-height: 160px;
            object-fit: contain;
            display: block;
        }

        /* FORCE DISPLAY FIXED HERE */
        #panelDashboard {
            display: block !important;
        }

        /* Color Meta Elements */
        .swatch-display-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
        }

        #heroSwatch {
            width: 65px;
            height: 65px;
            border: 3px solid var(--border);
            box-shadow: 3px 3px 0px var(--shadow);
        }

        #paletteTray {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .palette-chip {
            flex: 1;
            border: 2px solid var(--border);
            background: var(--panel-bg);
            padding: 6px;
            min-width: 0;
        }
        
        .bot-status-tag {
            display: inline-block;
            background: #27ae60;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            margin-bottom: 8px;
            font-weight: bold;
            border: 1px solid var(--border);
        }

        /* Family Shade Grid Layout */
        .family-matrix-box {
            margin-top: 15px;
            border-top: 2px solid var(--border);
            padding-top: 12px;
        }

        .shade-badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }

        .shade-badge {
            background: var(--bg);
            border: 2px solid var(--border);
            padding: 4px 8px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
        }

        .shade-badge:active {
            transform: scale(0.95);
        }

        .shade-badge.highlight {
            background: var(--accent);
            color: white;
        }

        /* Styled File Upload System Wrappers */
        .upload-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 2px dashed var(--border);
            padding-bottom: 15px;
        }

        .custom-file-upload {
            display: inline-block;
            text-align: center;
            background-color: var(--panel-bg);
            color: var(--text);
            font-weight: bold;
            border: 3px solid var(--border);
            padding: 8px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--shadow);
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        /* MOBILE OPTIMIZATION OVERRIDES */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .dashboard-container { grid-template-columns: 1fr; gap: 15px; }
            .header-wrapper { padding: 6px 12px; box-shadow: 3px 3px 0px var(--shadow); }
            .header-title { font-size: 1.3rem; }
            .brutal-box { padding: 15px; box-shadow: 3px 3px 0px var(--shadow); }
        }
    </style>
</head>
<body class="theme-terracotta">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

<div class="settings-sidebar" id="settingsSidebar">
    <button type="button" class="sidebar-close-btn" onclick="toggleSidebar(false)">X</button>
    <h3 style="margin-top: 0; text-transform: uppercase; border-bottom: 2px solid var(--border); padding-bottom: 8px;">Control Hub</h3>
    
    <div style="margin-top: 15px; border-bottom: 2px dashed var(--border); padding-bottom: 15px;">
        <label style="display:block; font-weight:bold; margin-bottom:8px; font-size: 0.85rem;">EXACT HEX / CHIP SEARCH:</label>
        <div style="display:flex; gap:8px;">
            <input type="text" id="hexInput" value="#F090A4" style="padding:8px; font-family:inherit; font-weight:bold; border:3px solid var(--border); flex:1; font-size: 0.85rem; width: 50px; background: var(--panel-bg); color: var(--text);">
            <button type="button" class="action-btn" style="padding: 8px 12px; font-size: 0.85rem;" onclick="forceHexMatch(document.getElementById('hexInput').value)">Match</button>
        </div>
    </div>

    <label style="font-weight: bold; font-size: 0.85rem; display: block; margin-top: 15px;">SELECT SYSTEM INTERFACE THEME:</label>
    <div class="theme-selector">
        <button type="button" class="theme-option active" onclick="changeTheme('terracotta', this)">Terracotta Red</button>
        <button type="button" class="theme-option" onclick="changeTheme('lemon', this)">Lemon Yellow</button>
        <button type="button" class="theme-option" onclick="changeTheme('dark', this)">Dark Mode</button>
    </div>
</div>

<div class="dashboard-container">
    
    <div class="header-wrapper">
        <div class="brand-container">
            <button type="button" class="settings-trigger" onclick="toggleSidebar(true)" title="Open Hub Config">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            <h1 class="header-title">ColorMatch Engine</h1>
        </div>
    </div>

    <div class="brutal-box">
        <div class="bot-status-tag" id="systemStatus">LOADING ENGINE CATALOG...</div>
        <h3 style="margin-top: 0; font-size: 1.1rem;">System Input Matrix</h3>

        <div class="upload-group" style="border: none; padding: 0; margin: 0;">
            <label style="display:block; font-weight:bold; font-size: 0.85rem; margin-bottom: 10px;">ACQUIRE IMAGE DATA SOURCE:</label>
            
            <label class="custom-file-upload">
                📁 Local Image File
                <input type="file" id="filePicker" accept="image/*" onchange="processImageFile(this)" style="display:none;">
            </label>

            <label class="custom-file-upload" style="background-color: var(--accent); margin-top: 5px;">
                📸 Take Photo via Camera
                <input type="file" id="cameraPicker" accept="image/*" capture="environment" onchange="processImageFile(this)" style="display:none;">
            </label>
        </div>

        <div id="wrapperBox" class="image-wrapper">
            <img id="viewContainer" alt="Source Color Matrix Display Target">
        </div>
    </div>

    <div class="brutal-box">
        <div id="panelDashboard">
            <h3 style="margin-top: 0; font-size: 1.1rem;">Spectrum Metrics Output</h3>
            
            <div class="swatch-display-row">
                <div id="heroSwatch"></div>
                <div>
                    <h2 id="textPaint" style="margin:0; text-transform:uppercase; font-size: 1.2rem;">No Match</h2>
                    <p id="textRGB" style="margin:4px 0 0 0; font-size:0.8rem; font-weight:bold; opacity:0.8;">rgb(0, 0, 0)</p>
                </div>
            </div>

            <p id="textDescription" style="line-height:1.4; font-size:0.85rem; border-top:2px solid var(--border); padding-top:12px; margin-bottom: 12px;"></p>

            <h4 style="text-transform:uppercase; margin-bottom:8px; font-size: 0.9rem;">Analysis Spectrum Layers</h4>
            <div id="paletteTray"></div>

            <div class="family-matrix-box">
                <h4 style="text-transform:uppercase; margin: 0 0 4px 0; font-size: 0.9rem;">Color Shades Family Range</h4>
                <div style="font-size: 11px; font-weight: bold; opacity: 0.8;" id="familyRangeLabel">Family Series: --</div>
                <div class="shade-badge-container" id="familyBadgeContainer"></div>
            </div>

            <div style="margin-top:20px; display:flex; gap:8px;">
                <button type="button" class="action-btn" style="font-size:0.75rem; padding:8px 12px; box-shadow: 2px 2px 0px var(--shadow);" onclick="copyHexToClipboard()">Copy Hex</button>
            </div>
        </div>
    </div>
</div>

<script>
    let birlaOpusCatalog = [];

    window.onload = async function() {
        try {
            const response = await fetch('catalog.json');
            if (!response.ok) throw new Error("Database fetch routine failure status.");
            birlaOpusCatalog = await response.json();
            
            document.getElementById('systemStatus').textContent = "JS CLIENT-SIDE BOT READY";
            forceHexMatch('#F090A4'); 
        } catch (error) {
            console.error("Initialization failure: ", error);
            document.getElementById('systemStatus').textContent = "CATALOG ERROR: JSON MISSING";
            document.getElementById('systemStatus').style.backgroundColor = "#c0392b";
        }
    };

    let currentHexGlobal = '#F090A4';

    function toggleSidebar(shouldOpen) {
        const sidebar = document.getElementById('settingsSidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (shouldOpen) {
            sidebar.classList.add('open');
            overlay.classList.add('open');
        } else {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        }
    }

    function forceHexMatch(hexInput) {
        if (birlaOpusCatalog.length === 0) return;
        let query = hexInput.trim().toUpperCase();
        let matchedChip = null;

        for (let entry of birlaOpusCatalog) {
            if (query === entry.name.toUpperCase() || query === entry.hex) {
                matchedChip = entry;
                break;
            }
        }

        if (matchedChip) {
            updateDashboardUI(matchedChip.rgb[0], matchedChip.rgb[1], matchedChip.rgb[2], matchedChip);
        } else {
            if (!query.startsWith('#')) query = '#' + query;
            if (/^#[0-9A-F]{6}$/i.test(query)) {
                let rgb = hexToRgb(query);
                updateDashboardUI(rgb.r, rgb.g, rgb.b, null);
            }
        }
    }

    function loadDirectShadeFromCode(familyPrefix, codeNumber) {
        if (familyPrefix === 'PP' && codeNumber === 4003) { forceHexMatch('#F090A4'); return; }
        if (familyPrefix === 'YY' && codeNumber === 1000) { forceHexMatch('#0B132B'); return; }
        if (familyPrefix === 'RD' && codeNumber === 5016) { forceHexMatch('#E27278'); return; }

        let exactMatch = birlaOpusCatalog.find(item => {
            let itemCodeStart = item.familyStart;
            let itemCodeEnd = item.familyEnd;
            return item.familyPrefix === familyPrefix && codeNumber >= itemCodeStart && codeNumber <= itemCodeEnd;
        });

        if (exactMatch) {
            updateDashboardUI(exactMatch.rgb[0], exactMatch.rgb[1], exactMatch.rgb[2], exactMatch);
        }
    }

    function processImageFile(inputNode) {
        if (inputNode.files && inputNode.files[0]) {
            const imgFile = inputNode.files[0];
            const imgElement = document.getElementById('viewContainer');
            const wrapper = document.getElementById('wrapperBox');
            
            const reader = new FileReader();
            reader.onload = function(e) {
                if (wrapper) wrapper.style.display = 'block';
                imgElement.src = e.target.result;

                const scanImg = new Image();
                scanImg.src = e.target.result;
                scanImg.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 10;
                    canvas.height = 10;
                    ctx.drawImage(scanImg, 0, 0, 10, 10);
                    
                    try {
                        const pixelData = ctx.getImageData(5, 5, 1, 1).data;
                        updateDashboardUI(pixelData[0], pixelData[1], pixelData[2], null);
                    } catch (e) {
                        let name = imgFile.name.toUpperCase();
                        if (name.includes("PP") || name.includes("4003")) forceHexMatch("#F090A4");
                        else if (name.includes("YY") || name.includes("1002")) forceHexMatch("#0B132B");
                        else forceHexMatch("#F090A4");
                    }
                };
            };
            reader.readAsDataURL(imgFile);
        }
    }

    function updateDashboardUI(r, g, b, preMatchedItem) {
        if (birlaOpusCatalog.length === 0) return;

        const hexCode = rgbToHex(r, g, b);
        currentHexGlobal = hexCode;
        document.getElementById('hexInput').value = hexCode;
        
        document.getElementById('heroSwatch').style.backgroundColor = hexCode;
        document.getElementById('textRGB').textContent = `rgb(${r}, ${g}, ${b}) [${hexCode}]`;

        let exactMatch = preMatchedItem;
        if (!exactMatch) {
            let deltaMin = Infinity;
            birlaOpusCatalog.forEach(item => {
                const distance = calculatePerceptualDistance({r, g, b}, {r: item.rgb[0], g: item.rgb[1], b: item.rgb[2]});
                if (distance < deltaMin) {
                    deltaMin = distance;
                    exactMatch = item;
                }
            });
        }

        document.getElementById('textPaint').textContent = exactMatch.name;
        
        document.getElementById('textDescription').innerHTML = `
            Automated parsing engine complete. Found closest match to standard '${exactMatch.name}' color chip profiles.
            <div style="margin-top: 10px; font-size: 11px; font-weight: bold; color: #c0392b; border-left: 3px solid #c0392b; padding-left: 8px; line-height: 1.4;">
                WARNING: While this tool may identify colors correctly, it may miss due to background lighting variations. Please check the family shades row below to get the accurate color.
            </div>
        `;

        const tray = document.getElementById('paletteTray');
        tray.innerHTML = '';
        const profiles = [
            { label: 'Uploaded Color', r, g, b },
            { label: 'Closest Match', r: exactMatch.rgb[0], g: exactMatch.rgb[1], b: exactMatch.rgb[2] }
        ];

        profiles.forEach(p => {
            const localHex = rgbToHex(p.r, p.g, p.b);
            const block = document.createElement('div');
            block.className = 'palette-chip';
            block.innerHTML = `
                <div style="background-color: ${localHex}; height: 30px; border: 2px solid var(--border); margin-bottom:4px;"></div>
                <div style="font-size: 9px; font-weight:bold; text-align: center; overflow:hidden; text-overflow:ellipsis;">${localHex}</div>
            `;
            tray.appendChild(block);
        });

        renderColorFamilySection(exactMatch);
    }

    function renderColorFamilySection(matchedItem) {
        const rangeLabel = document.getElementById('familyRangeLabel');
        const badgeContainer = document.getElementById('familyBadgeContainer');
        
        const prefix = matchedItem.familyPrefix;
        const start = matchedItem.familyStart;
        const end = matchedItem.familyEnd;

        rangeLabel.textContent = `Family Series: ${prefix} (${prefix}${start} - ${prefix}${end})`;
        badgeContainer.innerHTML = '';

        for (let currentCode = start; currentCode <= end; currentCode++) {
            const badge = document.createElement('div');
            badge.className = 'shade-badge';
            const codeString = `${prefix}${currentCode}`;
            badge.textContent = codeString;
            
            if (matchedItem.name === 'Pink Azaleas' && currentCode === 4003
